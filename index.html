<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Training Tracker</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #252525;
    --border: #333;
    --text: #f0f0f0;
    --text2: #999;
    --gold: #f5c518;
    --gold-dim: #8a6f0d;
    --green: #4caf50;
    --accent: #2a6eff;
    --radius: 16px;
    --tap: 52px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --surface2: #ebebeb;
      --border: #ddd;
      --text: #111;
      --text2: #666;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; }
  #app { flex: 1; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; width: 100%; }

  /* Nav */
  nav { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
  nav button { flex: 1; padding: 14px 4px 12px; background: none; border: none; color: var(--text2); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: color .2s; }
  nav button.active { color: var(--gold); }
  nav button svg { width: 24px; height: 24px; }

  /* Pages */
  .page { display: none; flex: 1; overflow-y: auto; padding: 20px 16px 32px; }
  .page.active { display: flex; flex-direction: column; gap: 16px; }

  /* Header */
  .page-title { font-size: 22px; font-weight: 700; }
  .date-label { font-size: 14px; color: var(--text2); }

  /* Exercise cards */
  .exercise-card { background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; align-items: center; gap: 12px; border: 2px solid transparent; transition: border-color .2s, background .2s; }
  .exercise-card.done { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 8%, var(--surface)); }
  .check-btn { width: 48px; height: 48px; min-width: 48px; border-radius: 50%; border: 2px solid var(--border); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; }
  .exercise-card.done .check-btn { background: var(--gold); border-color: var(--gold); }
  .check-btn svg { width: 22px; height: 22px; stroke: var(--text2); fill: none; transition: stroke .2s; }
  .exercise-card.done .check-btn svg { stroke: #000; }
  .ex-info { flex: 1; }
  .ex-name { font-size: 17px; font-weight: 600; }
  .ex-count-label { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .count-ctrl { display: flex; align-items: center; gap: 0; }
  .count-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .count-val { min-width: 44px; text-align: center; font-size: 18px; font-weight: 700; }

  /* Record button */
  .record-btn { min-height: var(--tap); border-radius: var(--radius); border: none; font-size: 17px; font-weight: 700; cursor: pointer; transition: all .2s; }
  .record-btn.primary { background: var(--gold); color: #000; }
  .record-btn.primary:active { filter: brightness(.85); }
  .record-btn.secondary { background: var(--surface); color: var(--text2); border: 1px solid var(--border); }

  /* Stars display */
  .stars-display { background: var(--surface); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .stars-row { display: flex; gap: 8px; }
  .star-icon svg { width: 40px; height: 40px; }
  .stars-label { font-size: 14px; color: var(--text2); }

  /* Calendar */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; }
  .cal-nav-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .cal-month { font-size: 18px; font-weight: 700; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--text2); padding: 4px 0; }
  .cal-day { background: var(--surface); border-radius: 10px; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 0; }
  .cal-day.empty { background: none; }
  .cal-day.today { outline: 2px solid var(--gold); }
  .cal-day-num { font-size: 12px; line-height: 1; }
  .cal-stars { font-size: 9px; line-height: 1; color: var(--gold); letter-spacing: -1px; }
  .cal-day.today .cal-day-num { font-weight: 700; color: var(--gold); }

  /* History list */
  .history-item { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  .history-date { font-size: 15px; font-weight: 600; }
  .history-detail { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .history-stars { font-size: 20px; color: var(--gold); }

  /* Settings */
  .setting-row { background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; align-items: center; justify-content: space-between; }
  .setting-label { font-size: 16px; font-weight: 600; }
  .setting-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .setting-ctrl { display: flex; align-items: center; gap: 4px; }
  .export-btn { min-height: var(--tap); border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 15px; cursor: pointer; width: 100%; }

  /* Toast */
  #toast { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 80px); left: 50%; transform: translateX(-50%) translateY(20px); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: all .3s; pointer-events: none; white-space: nowrap; z-index: 100; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Safe area */
  nav { padding-bottom: env(safe-area-inset-bottom); }
  .page { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div id="app">
  <!-- Today Page -->
  <div class="page active" id="page-today">
    <div>
      <div class="page-title">今日のトレーニング</div>
      <div class="date-label" id="today-date"></div>
    </div>
    <div id="stars-display" class="stars-display" style="display:none">
      <div class="stars-row" id="stars-row"></div>
      <div class="stars-label" id="stars-label"></div>
    </div>
    <div id="exercise-list"></div>
    <button class="record-btn primary" id="record-btn" onclick="saveRecord()">記録する</button>
    <button class="record-btn secondary" id="reset-btn" onclick="resetToday()" style="display:none">リセット</button>
  </div>

  <!-- Calendar Page -->
  <div class="page" id="page-calendar">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">&#8249;</button>
      <div class="cal-month" id="cal-month-label"></div>
      <button class="cal-nav-btn" onclick="changeMonth(1)">&#8250;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div id="history-list"></div>
  </div>

  <!-- Settings Page -->
  <div class="page" id="page-settings">
    <div class="page-title">設定</div>
    <div id="settings-list"></div>
    <button class="export-btn" onclick="exportData()">データをエクスポート (JSON)</button>
    <button class="export-btn" onclick="importData()" style="margin-top:8px">データをインポート (JSON)</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">
    <div style="text-align:center; font-size:12px; color:var(--text2); margin-top:8px">データはこのデバイスにのみ保存されます</div>
  </div>

  <nav>
    <button class="active" id="nav-today" onclick="showPage('today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      今日
    </button>
    <button id="nav-calendar" onclick="showPage('calendar')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      カレンダー
    </button>
    <button id="nav-settings" onclick="showPage('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      設定
    </button>
  </nav>
</div>
<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const EXERCISES = [
  { id: 'abs',    name: '腹筋',   emoji: '🔥' },
  { id: 'squat',  name: 'スクワット', emoji: '🦵' },
  { id: 'pushup', name: '腕立て', emoji: '💪' },
];
const DEFAULT_COUNTS = { abs: 30, squat: 30, pushup: 30 };
const STORAGE_KEY = 'training_records';
const SETTINGS_KEY = 'training_settings';

let todayCounts = { ...DEFAULT_COUNTS };
let todayDone = { abs: false, squat: false, pushup: false };
let todayRecorded = false;
let calYear, calMonth;
let settings = {};

function loadSettings() {
  try { settings = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch { settings = {}; }
  EXERCISES.forEach(e => { if (!settings[e.id + '_default']) settings[e.id + '_default'] = 30; });
}
function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveRecords(records) { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ── Star SVG ──────────────────────────────────────────────────────────────
function starSVG(filled, size = 40) {
  const color = filled ? '#f5c518' : '#444';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${filled ? color : 'none'}" stroke="${color}" stroke-width="1.5">
    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
  </svg>`;
}
function starsHTML(count, max = 3, size = 40) {
  let h = '';
  for (let i = 1; i <= max; i++) h += `<span class="star-icon">${starSVG(i <= count, size)}</span>`;
  return h;
}
function countToStars(done) {
  return Object.values(done).filter(Boolean).length;
}

// ── Today Page ────────────────────────────────────────────────────────────
function initToday() {
  // Load defaults
  EXERCISES.forEach(e => { todayCounts[e.id] = settings[e.id + '_default'] || 30; });

  // Check if already recorded today
  const records = loadRecords();
  const key = todayKey();
  if (records[key]) {
    const rec = records[key];
    todayDone = { ...rec.done };
    EXERCISES.forEach(e => { todayCounts[e.id] = rec.counts[e.id]; });
    todayRecorded = true;
  } else {
    todayDone = { abs: false, squat: false, pushup: false };
    todayRecorded = false;
  }

  document.getElementById('today-date').textContent = formatDateJP(new Date());
  renderExercises();
  renderStars();
  updateRecordBtn();
}

function renderExercises() {
  const el = document.getElementById('exercise-list');
  el.innerHTML = '';
  el.style.display = 'flex';
  el.style.flexDirection = 'column';
  el.style.gap = '10px';
  EXERCISES.forEach(ex => {
    const done = todayDone[ex.id];
    const count = todayCounts[ex.id];
    const card = document.createElement('div');
    card.className = 'exercise-card' + (done ? ' done' : '');
    card.id = 'card-' + ex.id;
    card.innerHTML = `
      <button class="check-btn" onclick="toggleExercise('${ex.id}')" aria-label="${ex.name}完了">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <div class="ex-info">
        <div class="ex-name">${ex.emoji} ${ex.name}</div>
        <div class="ex-count-label">${count}回</div>
      </div>
      <div class="count-ctrl">
        <button class="count-btn" onclick="adjustCount('${ex.id}', -5)">−</button>
        <span class="count-val" id="count-${ex.id}">${count}</span>
        <button class="count-btn" onclick="adjustCount('${ex.id}', 5)">＋</button>
      </div>
    `;
    el.appendChild(card);
  });
}

function toggleExercise(id) {
  if (todayRecorded) return;
  todayDone[id] = !todayDone[id];
  renderExercises();
  renderStars();
}

function adjustCount(id, delta) {
  if (todayRecorded) return;
  todayCounts[id] = Math.max(1, todayCounts[id] + delta);
  renderExercises();
}

function renderStars() {
  const n = countToStars(todayDone);
  const display = document.getElementById('stars-display');
  if (n === 0 && !todayRecorded) { display.style.display = 'none'; return; }
  display.style.display = 'flex';
  document.getElementById('stars-row').innerHTML = starsHTML(n);
  const labels = ['', '★ 1種目完了', '★★ 2種目完了', '★★★ 全種目完了！'];
  document.getElementById('stars-label').textContent = labels[n] || '';
}

function updateRecordBtn() {
  const rb = document.getElementById('record-btn');
  const rs = document.getElementById('reset-btn');
  if (todayRecorded) {
    rb.textContent = '記録済み ✓';
    rb.style.background = 'var(--green)';
    rb.onclick = null;
    rs.style.display = 'block';
  } else {
    rb.textContent = '記録する';
    rb.style.background = 'var(--gold)';
    rb.style.color = '#000';
    rb.onclick = saveRecord;
    rs.style.display = 'none';
  }
}

function saveRecord() {
  const n = countToStars(todayDone);
  const records = loadRecords();
  const key = todayKey();
  records[key] = { done: { ...todayDone }, counts: { ...todayCounts }, stars: n, ts: Date.now() };
  saveRecords(records);
  todayRecorded = true;
  renderStars();
  updateRecordBtn();
  const msgs = ['', '1種目を記録しました！', '2種目を記録しました！', '全種目完了！素晴らしい！'];
  showToast(msgs[n] || '記録しました');
}

function resetToday() {
  if (!confirm('今日の記録をリセットしますか？')) return;
  const records = loadRecords();
  delete records[todayKey()];
  saveRecords(records);
  todayRecorded = false;
  EXERCISES.forEach(e => { todayCounts[e.id] = settings[e.id + '_default'] || 30; todayDone[e.id] = false; });
  renderExercises();
  renderStars();
  updateRecordBtn();
}

// ── Calendar Page ─────────────────────────────────────────────────────────
function initCalendar() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  renderCalendar();
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('cal-month-label').textContent = `${calYear}年${calMonth + 1}月`;
  const records = loadRecords();
  const now = new Date();
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  const dows = ['日','月','火','水','木','金','土'];
  dows.forEach(d => { const el = document.createElement('div'); el.className = 'cal-dow'; el.textContent = d; grid.appendChild(el); });

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div'); el.className = 'cal-day empty'; grid.appendChild(el);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = records[key];
    const isToday = now.getFullYear() === calYear && now.getMonth() === calMonth && now.getDate() === d;
    const el = document.createElement('div');
    el.className = 'cal-day' + (isToday ? ' today' : '');
    const starsStr = rec ? (rec.stars > 0 ? '★'.repeat(rec.stars) : '·') : '';
    el.innerHTML = `<span class="cal-day-num">${d}</span>${starsStr ? `<span class="cal-stars">${starsStr}</span>` : ''}`;
    grid.appendChild(el);
  }

  // History list
  const hist = document.getElementById('history-list');
  hist.innerHTML = '';
  hist.style.display = 'flex';
  hist.style.flexDirection = 'column';
  hist.style.gap = '8px';

  const monthKeys = Object.keys(records).filter(k => k.startsWith(`${calYear}-${String(calMonth+1).padStart(2,'0')}`)).sort().reverse();
  if (monthKeys.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'text-align:center;color:var(--text2);font-size:14px;padding:16px';
    empty.textContent = 'この月の記録はありません';
    hist.appendChild(empty);
    return;
  }
  monthKeys.forEach(k => {
    const rec = records[k];
    const [y, m, d] = k.split('-');
    const item = document.createElement('div');
    item.className = 'history-item';
    const details = EXERCISES.map(e => rec.done[e.id] ? `${e.name}${rec.counts[e.id]}回` : null).filter(Boolean).join('・');
    item.innerHTML = `
      <div>
        <div class="history-date">${m}月${parseInt(d)}日</div>
        <div class="history-detail">${details || '記録なし'}</div>
      </div>
      <div class="history-stars">${'★'.repeat(rec.stars)}</div>
    `;
    hist.appendChild(item);
  });
}

// ── Settings Page ─────────────────────────────────────────────────────────
function renderSettings() {
  const list = document.getElementById('settings-list');
  list.innerHTML = '';
  list.style.display = 'flex';
  list.style.flexDirection = 'column';
  list.style.gap = '10px';

  EXERCISES.forEach(ex => {
    const key = ex.id + '_default';
    const val = settings[key] || 30;
    const row = document.createElement('div');
    row.className = 'setting-row';
    row.innerHTML = `
      <div>
        <div class="setting-label">${ex.emoji} ${ex.name}</div>
        <div class="setting-sub">デフォルト回数</div>
      </div>
      <div class="setting-ctrl">
        <button class="count-btn" onclick="adjustDefault('${ex.id}', -5)">−</button>
        <span class="count-val" id="default-${ex.id}">${val}</span>
        <button class="count-btn" onclick="adjustDefault('${ex.id}', 5)">＋</button>
      </div>
    `;
    list.appendChild(row);
  });
}

function adjustDefault(id, delta) {
  const key = id + '_default';
  settings[key] = Math.max(1, (settings[key] || 30) + delta);
  saveSettings();
  document.getElementById('default-' + id).textContent = settings[key];
}

function exportData() {
  const records = loadRecords();
  const blob = new Blob([JSON.stringify({ records, settings, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `training-${todayKey()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('エクスポートしました');
}

function importData() { document.getElementById('import-file').click(); }
function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.records) throw new Error('invalid');
      if (!confirm('現在のデータを上書きしてインポートしますか？')) return;
      saveRecords(data.records);
      if (data.settings) { settings = data.settings; saveSettings(); }
      showToast('インポートしました');
      renderSettings();
    } catch { showToast('インポートに失敗しました'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ── Navigation ────────────────────────────────────────────────────────────
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'calendar') renderCalendar();
  if (name === 'settings') renderSettings();
  if (name === 'today') { initToday(); }
}

// ── Helpers ───────────────────────────────────────────────────────────────
function formatDateJP(d) {
  const days = ['日','月','火','水','木','金','土'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Boot ──────────────────────────────────────────────────────────────────
loadSettings();
initToday();
initCalendar();
</script>
